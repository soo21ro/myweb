<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片連結畫廊</title>
    <!-- 引入外部 CSS 檔案 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>MY WEB 影音畫廊</h1>
        <p>將滑鼠移至圖片上可查看晃動效果，點擊圖片跳轉至 YouTube 影片</p>
    </header>

    <main class="gallery-container">
        <!-- 圖片 1 -->
        <a href="https://www.youtube.com/watch?v=D4syWqgckBU" target="_blank" class="gallery-item">
            <img src="image1.jpg" alt="影片 1 縮圖">
        </a>

        <!-- 圖片 2 -->
        <a href="https://www.youtube.com/watch?v=qpRfZuvupw4" target="_blank" class="gallery-item">
            <img src="image2.jpg" alt="影片 2 縮圖">
        </a>

        <!-- 圖片 3 -->
        <a href="https://www.youtube.com/watch?v=3pqlVJVeQn0" target="_blank" class="gallery-item">
            <img src="image3.jpg" alt="影片 3 縮圖">
        </a>

        <!-- 圖片 4 -->
        <a href="https://www.youtube.com/watch?v=m6y_b4jOFfU" target="_blank" class="gallery-item">
            <img src="image4.jpg" alt="影片 4 縮圖">
        </a>

        <!-- 圖片 5 -->
        <a href="https://www.youtube.com/watch?v=GmPKp7q2_hM" target="_blank" class="gallery-item">
            <img src="image5.jpg" alt="影片 5 縮圖">
        </a>
    </main>

</body>
</html>
